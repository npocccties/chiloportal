services:
  app:
    build:
      context: .
      args:
        # テストを実行するので開発用の依存も入れる
        REQUIREMENTS: requirements-dev.txt
    tty: true
    ports:
      - 80:8000
    networks:
      - app_network
    volumes:
      - ./:/workspace
      -  ${PWD}/${IMAGE_DIR}:/workspace/output/images/
      -  ./logs:/var/log/chiloportal/
      - ./static:/workspace/static
    environment:
      - SECRET_KEY=$SECRET_KEY
      - DB_HOST=$DB_HOST
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASS=$DB_PASS
      - DEBUG=$DEBUG
      - LOGGER_LEVEL=$LOGGER_LEVEL
      - ALLOWED_HOSTS=$ALLOWED_HOSTS
      - JUDGE_BADGE=$JUDGE_BADGE
      - PER_PAGE=$PER_PAGE
      - BCRYPT_SALT=$BCRYPT_SALT
      - REVALIDATE_URL=$REVALIDATE_URL
      - REVALIDATE_SECRET=$REVALIDATE_SECRET
      - JWT_VERIFICATION_KEY_BASE64=$JWT_VERIFICATION_KEY_BASE64
      - SHIBBOLETH_SP_LOGIN_URL=$SHIBBOLETH_SP_LOGIN_URL
      - SHIBBOLETH_SP_LOGOUT_URL=$SHIBBOLETH_SP_LOGOUT_URL
      - JWT_DEBUG_VALUE=$JWT_DEBUG_VALUE
    depends_on:
      - db
      - migration

  migration:
    build:
      context: .
      args:
        # テストを実行するので開発用の依存も入れる
        REQUIREMENTS: requirements-dev.txt
    command: bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; python /workspace/manage.py migrate --fake-initial'
    networks:
      - app_network
    volumes:
      - ./:/workspace
    environment:
      - SECRET_KEY=$SECRET_KEY
      - DB_HOST=$DB_HOST
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASS=$DB_PASS
      - DEBUG=$DEBUG
      - LOGGER_LEVEL=$LOGGER_LEVEL
      - ALLOWED_HOSTS=$ALLOWED_HOSTS
    depends_on:
      - db

  db:
    # PostgreSQL は 19 系。パッチ版はデプロイ時の pull で取り込む
    image: postgres:19
    networks:
      - app_network
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
    ports:
      - 5433:5432
    volumes:
      - ./postgresql/pg19:/var/lib/postgresql

networks:
  app_network:
    driver: bridge