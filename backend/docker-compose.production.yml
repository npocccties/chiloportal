services:
  web:
    # nginx は stable 系（1.30）。パッチ版はデプロイ時の pull で取り込み、毎年4月に次の stable 系へ上げる
    image: nginx:1.30
    ports:
      - '80:80'
      - '443:443'
    networks:
      - app_network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/workspace/static
      - ./media:/workspace/media:ro
      - ${SSL_CERTS_DIR}/signed.crt:/etc/nginx/conf.d/signed.crt
      - ${SSL_CERTS_DIR}/domain.key:/etc/nginx/conf.d/domain.key
      - ./50x.html:/usr/share/nginx/html/50x.html
    depends_on:
      - app
    restart: always

  app:
    build: .
    tty: true
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000
    expose:
      - 8000
    networks:
      - app_network
    volumes:
      - ./:/workspace
      -  ${PWD}/${IMAGE_DIR}:/workspace/output/images/
      -  ./logs:/var/log/chiloportal/
      - ./static:/workspace/static
    environment:
      - SECRET_KEY=$SECRET_KEY
      - DB_HOST=$DB_HOST
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASS=$DB_PASS
      - DEBUG=$DEBUG
      - LOGGER_LEVEL=$LOGGER_LEVEL
      - ALLOWED_HOSTS=$ALLOWED_HOSTS
      - JUDGE_BADGE=$JUDGE_BADGE
      - PER_PAGE=$PER_PAGE
      - BCRYPT_SALT=$BCRYPT_SALT
      - REVALIDATE_URL=$REVALIDATE_URL
      - REVALIDATE_SECRET=$REVALIDATE_SECRET
      - JWT_VERIFICATION_KEY_BASE64=$JWT_VERIFICATION_KEY_BASE64
      - SHIBBOLETH_SP_LOGIN_URL=$SHIBBOLETH_SP_LOGIN_URL
      - SHIBBOLETH_SP_LOGOUT_URL=$SHIBBOLETH_SP_LOGOUT_URL
    depends_on:
      - db
      - migration
    restart: always

  migration:
    build: .
    command: bash -c 'while !</dev/tcp/db/5432; do sleep 1; done; python /workspace/manage.py migrate --fake-initial'
    networks:
      - app_network
    volumes:
      - ./:/workspace
    environment:
      - SECRET_KEY=$SECRET_KEY
      - DB_HOST=$DB_HOST
      - DB_NAME=$DB_NAME
      - DB_USER=$DB_USER
      - DB_PASS=$DB_PASS
      - DEBUG=$DEBUG
      - LOGGER_LEVEL=$LOGGER_LEVEL
      - ALLOWED_HOSTS=$ALLOWED_HOSTS
    depends_on:
      - db

  db:
    # PostgreSQL は 19 系。パッチ版はデプロイ時の pull で取り込む
    image: postgres:19
    networks:
      - app_network
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
    ports:
      - 5433:5432
    volumes:
      # PostgreSQL 18 以降のイメージの置き場所（/var/lib/postgresql/<版>/docker）に合わせる。
      # 13 のデータ（db_data）は切り戻し用に残し、19 は新しいボリュームに置く
      - db_data_pg19:/var/lib/postgresql
    restart: always

networks:
  app_network:
    driver: bridge
    external: true
volumes:
  db_data:
  db_data_pg19:
