geo $white_ip {
    default 1;
    172.18.0.254 0;
}

map $white_ip $limit_object {
    0   "";
    1   $binary_remote_addr;
}

limit_req_zone $limit_object zone=lrz:10m rate=30r/s;

server {
    listen 8080;
    # 起動時に app / frontend が未起動でも nginx が落ちないよう、名前解決をリクエスト時に行う
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $project_backend http://app:8000;
    set $front_backend http://frontend:3000;
    location ^~ /admin {
        limit_req zone=lrz burst=15 nodelay;
        # allow xxx.xxx.xxx.xxx;
        # deny all;
        proxy_pass $project_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    location ^~ /api/v1 {
        limit_req zone=lrz burst=30 nodelay;
        proxy_pass $project_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    location / {
        limit_req zone=lrz burst=30 nodelay;
        proxy_pass $front_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
    location /static/ {
        alias /workspace/static/;
    }
    error_page  503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}